<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRR">
<meta name="theme-color" content="#0f1a17">
<link rel="apple-touch-icon" href="icon.png">
<title>General Review — Site Walk</title>
<script src="jszip.min.js"></script>
<script src="pdf-lib.min.js"></script>
<style>
:root{
  --bg:#0f1a17; --card:#182722; --card2:#1f322c; --line:#2b443c;
  --ink:#eef5f2; --dim:#8fa8a0; --teal:#7fd4b4; --teal-dk:#134e3a;
  --red:#ff6b6b; --amber:#ffc266;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,'SF Pro Text',Segoe UI,Roboto,sans-serif;}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));}
header.app{position:sticky;top:0;z-index:20;background:rgba(15,26,23,.92);backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px}
header.app h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header.app .rn{color:var(--teal);font-weight:800}
header.app .proj{font-size:11px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.25}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(15,26,23,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px}
.tabbar button.on{color:var(--teal)}
.tabbar .ic{font-size:21px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:0 0 10px;font-weight:700}
label.f{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:16px;padding:10px 12px;font-family:inherit}
textarea{min-height:110px;line-height:1.45;resize:vertical}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;color:var(--dim);font-size:13px;font-weight:600;padding:10px 4px;border-radius:9px}
.seg button.on{background:var(--teal-dk);color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
  font-size:15px;font-weight:700;padding:13px 16px;color:#06251a;background:var(--teal);width:100%}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--red);color:#2b0505}
.btn.small{width:auto;padding:8px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:var(--card2);
  font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--ink)}
.mic.rec{background:#5b1010;border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}70%{box-shadow:0 0 0 16px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:8px 0 0}
.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.item .num{color:var(--teal);font-weight:800;font-size:13px}
.item .sec-tag{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;float:right}
.item p{margin:6px 0 8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.item .ops{display:flex;gap:6px;flex-wrap:wrap}
.item.resolved{opacity:.5}
.item.resolved p{text-decoration:line-through}
.item .dragh{float:right;color:var(--dim);font-size:19px;line-height:1;padding:2px 2px 10px 14px;
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.item.dragging{opacity:.55;transform:scale(1.02);border-color:var(--teal)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.th{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#000}
.th img{width:100%;height:100%;object-fit:cover}
.th .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px;line-height:1}
.th .r{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px}
.th .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:var(--teal);font-size:9px;
  padding:1px 4px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid .th{width:100%;height:auto;aspect-ratio:3/4}
.badge{display:inline-block;background:var(--teal-dk);color:var(--teal);font-size:11px;font-weight:700;
  border-radius:99px;padding:2px 9px;margin-left:6px}
.dist-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.dist-row input{font-size:13px;padding:8px 9px}
.dist-row button{background:none;border:none;color:var(--red);font-size:17px;width:30px}
.date-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.date-row button{background:none;border:none;color:var(--red);font-size:17px;width:30px}
.preview{background:#fff;color:#111;border-radius:12px;padding:18px 16px;font-family:'Helvetica Neue',Arial,sans-serif;
  font-size:12.5px;line-height:1.4;max-height:520px;overflow:auto;-webkit-overflow-scrolling:touch}
.preview h3{font-size:13px;margin:14px 0 6px;font-family:Arial;letter-spacing:.02em}
.preview .it{margin:0 0 8px;display:flex;gap:10px}
.preview .it b{min-width:34px;font-weight:400}
.preview .hd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
.preview .disc{font-size:10.5px;color:#333;margin:10px 0}
.preview img.sig{height:44px;display:block;margin:8px 0 0}
.preview .sigline{border-bottom:1px solid #111;width:210px;margin-bottom:3px}
.preview .parr{display:grid;gap:4px;margin-top:8px}
.preview .parr img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #ccc}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--teal);color:#06251a;font-weight:700;font-size:14px;padding:11px 20px;border-radius:99px;
  z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:opacity .3s;opacity:0;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:18px 8px}
.gate{border:1px solid var(--amber);border-radius:12px;padding:12px;background:rgba(255,194,102,.07);margin-top:12px}
.gate b{color:var(--amber)}
h2.secttl{font-size:15px;margin:18px 2px 8px;color:var(--ink)}
.filechip{font-size:13px;color:var(--teal);word-break:break-all}
.note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}
.grid-set{display:flex;gap:10px;align-items:center}
.grid-set input{width:64px;text-align:center}
hr.s{border:none;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header class="app">
  <h1>General Review <span class="rn" id="hdrNo">No. —</span></h1>
  <div class="proj" id="hdrProj"></div>
</header>
<main id="main"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="walk"><span class="ic">🎙️</span>Walk</button>
  <button data-tab="super"><span class="ic">🙋</span>Super</button>
  <button data-tab="prev"><span class="ic">📋</span>Previous</button>
  <button data-tab="photos"><span class="ic">📷</span>Photos</button>
  <button data-tab="report"><span class="ic">📄</span>Report</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Setup</button>
</nav>
<div class="toast" id="toast"></div>

<input type="file" id="fileItem" accept="image/*" multiple hidden>
<input type="file" id="fileGen" accept="image/*" multiple hidden>
<input type="file" id="fileSig" accept="image/*" hidden>
<input type="file" id="fileImp" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

/* ======== IndexedDB photo store ======== */
let dbp=null;
function db(){ if(dbp) return dbp;
  dbp = new Promise((res,rej)=>{
    const rq = indexedDB.open('grr-photos',1);
    rq.onupgradeneeded = ()=> rq.result.createObjectStore('photos',{keyPath:'id'});
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error);
  }); return dbp;
}
async function photoPut(rec){ const d = await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').put(rec);
  tx.oncomplete=res; tx.onerror=()=>rej(tx.error);});}
async function photoGet(id){ const d = await db(); return new Promise((res,rej)=>{
  const rq=d.transaction('photos').objectStore('photos').get(id);
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);});}
async function photoDel(id){ const d = await db(); return new Promise((res)=>{
  const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=res;});}
async function photoClearAll(){ const d = await db(); return new Promise((res)=>{
  const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').clear(); tx.oncomplete=res;});}
const thumbCache = {};
async function thumbURL(id){
  if(thumbCache[id]) return thumbCache[id];
  const rec = await photoGet(id); if(!rec) return '';
  const u = URL.createObjectURL(rec.blob); thumbCache[id]=u; return u;
}

/* ======== photo import (auto-orient + downscale) ======== */
async function importFiles(files, itemRef){
  const ids=[];
  for(const f of files){
    try{
      let bmp;
      try{ bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); }
      catch(e){ bmp = await createImageBitmap(f); }
      const MAX=1600;
      const sc = Math.min(1, MAX/Math.max(bmp.width,bmp.height));
      const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(bmp,0,0,w,h);
      const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
      const id = uid();
      await photoPut({id, blob, rot:0, itemRef:itemRef||null});
      ids.push(id);
      bmp.close && bmp.close();
    }catch(e){ console.error(e); toast('⚠️ One photo failed to import'); }
  }
  return ids;
}
async function rotatePhoto(id){
  const rec = await photoGet(id); if(!rec) return;
  rec.rot = ((rec.rot||0)+90)%360;
  await photoPut(rec);
  delete thumbCache[id];
}
async function rotatedBlob(rec, maxDim, aspect){
  const bmp = await createImageBitmap(rec.blob);
  const rot = rec.rot||0;
  const rad = rot*Math.PI/180;
  let sw = (rot%180===0)? bmp.width : bmp.height;
  let sh = (rot%180===0)? bmp.height : bmp.width;
  let cw=sw, chh=sh;
  if(aspect){ // cover-crop to aspect (w/h)
    if(sw/sh > aspect) cw = sh*aspect; else chh = sw/aspect;
  }
  const sc = maxDim? Math.min(1, maxDim/Math.max(cw,chh)) : 1;
  const c=document.createElement('canvas'); c.width=Math.round(cw*sc); c.height=Math.round(chh*sc);
  const x=c.getContext('2d');
  x.translate(c.width/2,c.height/2); x.rotate(rad); x.scale(sc,sc);
  x.drawImage(bmp,-bmp.width/2,-bmp.height/2);
  const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
  bmp.close && bmp.close();
  return blob;
}

/* ======== numbering ======== */
function numbered(){
  const N = S.report.number;
  const prog = S.report.progress.map((it,i)=>({...it, num:`${N}.${i+1}`}));
  const obs  = S.report.obs.map((it,i)=>({...it, num:`${N}.${S.report.progress.length+i+1}`}));
  const prev = S.report.prev.filter(p=>!p.resolved);
  return {prog, obs, prev};
}
function fmtDates(){
  const ds = S.report.dates.filter(Boolean).map(d=>{
    const [y,m,day]=d.split('-').map(Number);
    const mo=['January','February','March','April','May','June','July','August','September','October','November','December'][m-1];
    return {y, s:`${mo} ${day}`};
  });
  if(!ds.length) return '';
  const yr = ds[ds.length-1].y;
  const parts = ds.map(d=>d.s);
  let joined = parts.length>1 ? parts.slice(0,-1).join(', ')+' & '+parts[parts.length-1] : parts[0];
  return `${joined}, ${yr}`;
}

/* ---- drag to reorder (press ⠿ and move) ---- */
function enableDrag(container){
  let drag=null;
  container.querySelectorAll('.dragh').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      const item=h.closest('.item');
      drag={item, sec:item.dataset.sec};
      item.classList.add('dragging');
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault();
    });
    h.addEventListener('pointermove', e=>{
      if(!drag) return;
      const siblings=[...container.querySelectorAll(`.item[data-sec="${drag.sec}"]`)].filter(x=>x!==drag.item);
      for(const sib of siblings){
        const r=sib.getBoundingClientRect();
        if(e.clientY>r.top && e.clientY<r.bottom){
          if(e.clientY < r.top+r.height/2) sib.before(drag.item); else sib.after(drag.item);
          break;
        }
      }
    });
    const up=()=>{ if(!drag) return;
      drag.item.classList.remove('dragging');
      const orderP=[...container.querySelectorAll('.item[data-sec="progress"]')].map(n=>n.dataset.id);
      const orderO=[...container.querySelectorAll('.item[data-sec="obs"]')].map(n=>n.dataset.id);
      S.report.progress.sort((a,b)=>orderP.indexOf(a.id)-orderP.indexOf(b.id));
      S.report.obs.sort((a,b)=>orderO.indexOf(a.id)-orderO.indexOf(b.id));
      drag=null; save(); render();
    };
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
}

async function aiCommand(){
  if(!S.settings.aiKey){ toast('AI command needs your API key — add it in Setup'); TAB='settings'; render(); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ const t=prompt('Command (e.g. "move 18.1 to the end of progress")'); if(t)runCommand(t.trim()); return; }
  const r=new SR(); r.lang='en-CA'; r.interimResults=false; r.continuous=false;
  const h=$('#micHint'); if(h)h.textContent='🎛 Listening for a command…';
  r.onresult=e=>{ const t=e.results[0][0].transcript; if(t)runCommand(t.trim()); };
  r.onend=()=>{ const h2=$('#micHint'); if(h2)h2.textContent='Talk, type, or use the keyboard mic below'; };
  r.onerror=ev=>toast('Mic: '+ev.error);
  try{ r.start(); }catch(e){}
}
async function runCommand(cmd){
  toast('🎛 "'+cmd+'"');
  const {prog,obs,prev}=numbered();
  const ctx={progress:prog.map(x=>({num:x.num,text:x.text.slice(0,70)})),
             observations:obs.map(x=>({num:x.num,text:x.text.slice(0,70)})),
             previous_deficiencies:prev.map(x=>({num:x.num,text:x.text.slice(0,70)}))};
  const SYS='You interpret a voice command for a construction report app and respond with ONLY a JSON object, no prose. Schemas: {"action":"move","num":"<item no>","to":"end"|"start"|"after"|"before","ref":"<item no>"} (ref only when to is after/before; items stay within their own section), {"action":"resolve","num":"<previous item no>"}, {"action":"reopen","num":"<previous item no>"}, {"action":"delete","num":"<item no>"}, {"action":"unknown","why":"<short reason>"}. Current items: '+JSON.stringify(ctx);
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':S.settings.aiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:200,system:SYS,
        messages:[{role:'user',content:cmd}]})});
    const data=await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message)||resp.status);
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('no command understood');
    applyCommand(JSON.parse(m[0]));
  }catch(e){ toast('Command failed: '+e.message); }
}
function findByNum(num){
  const {prog,obs}=numbered();
  let hit=prog.find(x=>x.num===num);
  if(hit) return {arr:S.report.progress, idx:S.report.progress.findIndex(i=>i.id===hit.id)};
  hit=obs.find(x=>x.num===num);
  if(hit) return {arr:S.report.obs, idx:S.report.obs.findIndex(i=>i.id===hit.id)};
  return null;
}
function applyCommand(c){
  if(c.action==='move'){
    const f=findByNum(c.num); if(!f){ toast('Item '+c.num+' not found'); return; }
    let refIdx=null;
    if(c.to==='after'||c.to==='before'){
      const g=findByNum(c.ref);
      if(g && g.arr===f.arr){ refIdx=g.idx; if(refIdx>f.idx) refIdx--; if(c.to==='after') refIdx++; }
    }
    const [it]=f.arr.splice(f.idx,1);
    let target = refIdx!=null ? refIdx : (c.to==='start'?0:f.arr.length);
    f.arr.splice(Math.max(0,Math.min(target,f.arr.length)),0,it);
    save(); render(); toast('Moved item — numbers updated');
  } else if(c.action==='resolve'||c.action==='reopen'){
    const p=S.report.prev.find(x=>x.num===c.num);
    if(!p){ toast('Item '+c.num+' not found in previous deficiencies'); return; }
    p.resolved=(c.action==='resolve'); save(); render();
    toast(c.num+(p.resolved?' marked resolved':' reopened'));
  } else if(c.action==='delete'){
    const f=findByNum(c.num); if(!f){ toast('Item '+c.num+' not found'); return; }
    if(confirm('Delete item '+c.num+'?')){ f.arr.splice(f.idx,1); save(); render(); toast('Deleted'); }
  } else toast('Did not understand'+(c.why?': '+c.why:' — try again'));
}

async function aiBuildFromWalk(){
  const notes=(S.report.walkNotes||[]).join('\n---\n').trim();
  if(!notes){ toast('Record a walk first'); return; }
  if(!S.settings.aiKey){ toast('Add your API key in Setup'); TAB='settings'; render(); return; }
  if(walkOn){ walkOn=false; try{ walkRecog.stop(); }catch(e){} }
  const h=$('#walkHint'); if(h)h.textContent='✨ Building report items from your walk…';
  const btn=$('#buildBtn'); if(btn)btn.disabled=true;
  const SYS=`You turn an Ontario architect's recorded site-walkthrough narration into items for General Review Report (OAA general review, Pro-Demnity-conscious wording).

Respond with ONLY a JSON object: {"progress":["item text", ...], "observations":["item text", ...], "super_questions":["question", ...]}

How to build the items:
- GROUP related mentions across the whole walk into single items by trade/scope: if the speaker mentions interior steel stud framing on several floors at different moments, combine into ONE item, e.g. "Interior steel stud framing near completion at Levels 2 and 3; not started at Levels 6 and 7."
- Order items logically by trade/assembly, generally following construction sequence.
- "progress" = status of work (underway, continuing, complete, not started, deliveries, mock-ups).
- "observations" = deficiencies, nonconformances, concerns, items requiring correction, review or coordination — state the required follow-up and responsible party ("Contractor to correct and advise.", "Structural Consultant to review.").
- "super_questions" = questions or points the speaker wants to raise, ask, confirm or discuss with the site superintendent ("ask the super…", "need to confirm with…", "what's happening with…") — concise questions, NOT report items. These never go in progress or observations.
- Concise, factual, past-tense observational voice ("observed", "noted"). 1–3 sentences per item.
- Stay in the architect's lane: no means and methods, no safety directives, refer other consultants' scopes to them.
- Resolve self-corrections (keep only final intent). Ignore filler, asides, and conversation not meant for the report.
- Do not invent anything not in the notes.

Example item voice: "Studwork framing continuing throughout levels 1-6; electrical rough-in continuing (3rd floor suites substantially complete, common areas underway)."`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':S.settings.aiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:3000,system:SYS,
        messages:[{role:'user',content:'Walkthrough narration (segments separated by ---):\n'+notes}]})});
    const data=await resp.json();
    if(!resp.ok) throw new Error((data.error&&data.error.message)||resp.status);
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const m=txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('no items returned');
    const out=JSON.parse(m[0]);
    const np=(out.progress||[]).filter(t=>t&&t.trim());
    const no=(out.observations||[]).filter(t=>t&&t.trim());
    const nq=(out.super_questions||[]).filter(t=>t&&t.trim());
    if(!np.length && !no.length && !nq.length) throw new Error('nothing extracted');
    // insert progress items before the consultant-reference boiler item if it is last
    const boilerIdx=S.report.progress.findIndex(x=>x.boiler);
    const insertAt=(boilerIdx>=0 && boilerIdx===S.report.progress.length-1)?boilerIdx:S.report.progress.length;
    S.report.progress.splice(insertAt,0,...np.map(t=>({id:uid(),text:t.trim(),photoIds:[]})));
    no.forEach(t=>S.report.obs.push({id:uid(),text:t.trim(),photoIds:[]}));
    nq.forEach(t=>(S.report.superQs=S.report.superQs||[]).push({id:uid(),text:t.trim(),done:false}));
    S.report.walkNotes=[];
    save(); render();
    toast('✨ Built: '+np.length+' progress · '+no.length+' observation(s)'+(nq.length?' · '+nq.length+' super question(s) → Super tab':'')+' — review & edit');
  }catch(e){
    if(btn)btn.disabled=false;
    const h2=$('#walkHint'); if(h2)h2.textContent='Tap to start recording the walk';
    toast('Build failed: '+e.message+' — walk notes kept');
  }
}

/* ---- AI compose: spoken intent -> report-ready item ---- */
const AI_SYS = `You turn an Ontario architect's spoken field notes into ONE item for a General Review Report (OAA general review, Pro-Demnity-conscious wording). Output ONLY the finished item text — no item number, no preamble, no quotes.

Style rules, matching the firm's reports:
- Concise and factual, 1–3 sentences. Past-tense observational voice ("observed", "noted") for conditions; present/future for actions.
- Identify location precisely (level, unit, elevation, room) when the speaker gives it.
- State the required follow-up and the responsible party: "Contractor to correct and advise.", "Structural Consultant to review.", "To be reviewed and coordinated with the Mechanical Consultant."
- Stay in the architect's lane: never prescribe construction means and methods, never direct safety procedures, never accept or assign design responsibility that belongs to another consultant — refer it to them instead.
- Progress items simply describe work status ("continuing", "underway", "complete").
- If the speaker corrects themselves ("no, wait, actually…"), keep ONLY the corrected final intent.
- Ignore filler, asides, and anything clearly not meant for the report.

Examples of the target voice:
- "Studwork framing continuing throughout levels 1-6; electrical rough-in continuing (3rd floor suites substantially complete, common areas underway)."
- "Barrier-free shower pans: reinforcing was observed installed too close to the slab surface and exposed at several washroom/shower locations, requiring a coordinated repair. The Structural Consultant to provide a remedial solution upon the General Contractor confirming the number of affected locations."
- "A window introduced at Unit 311 is not shown on the drawings. PC issued."
- "Contractor advised cloth atop insulation will be required as specified including at u/s of roof screen base plates."`;

async function aiCompose(raw){
  const key=S.settings.aiKey;
  if(!key){ toast('Add your API key in Setup first'); TAB='settings'; render(); return; }
  lastRaw=raw;
  const hint=$('#micHint'); if(hint) hint.textContent='✨ Writing item…';
  const box=$('#noteBox');
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:400,
        system: AI_SYS,
        messages:[{role:'user',content:'Section: '+(WALKSEC==='progress'?'Progress of the Work':'Observations and Comments')+'\nSpoken notes:\n'+raw}]})
    });
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      throw new Error((err.error&&err.error.message)||('API error '+resp.status));
    }
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!text) throw new Error('Empty response');
    if(box){ box.value=text; const rb=$('#rawBtn'); if(rb) rb.style.display=''; }
    if(hint) hint.textContent='Review the item — edit anything, then Save';
    toast('✨ Item written — review before saving');
  }catch(e){
    if(hint) hint.textContent='Talk, type, or use the keyboard mic below';
    toast('AI compose failed: '+e.message+' — raw transcript kept');
    if(box && !box.value.trim()) box.value=raw;
  }
}

function toggleSuperRec(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Voice unavailable — type the question or use the keyboard mic 🎤'); return; }
  if(sRecOn){ sRecog.stop(); return; }
  sRecog=new SR(); sRecog.lang='en-CA'; sRecog.continuous=true; sRecog.interimResults=true;
  let acc='';
  sRecog.onresult=e=>{ let fin='',inter='';
    for(let i=0;i<e.results.length;i++){ const r=e.results[i];
      if(r.isFinal) fin+=r[0].transcript; else inter+=r[0].transcript; }
    acc=fin; const bx=$('#sBox'); if(bx) bx.value=fin+inter; };
  sRecog.onstart=()=>{ sRecOn=true; const b=$('#sMicAi'); if(b)b.classList.add('rec');
    const h=$('#sHint'); if(h)h.textContent="Listening… tap again when you've said it"; };
  sRecog.onend=async()=>{ sRecOn=false;
    document.querySelectorAll('.mic').forEach(b=>b.classList.remove('rec'));
    const h=$('#sHint'); if(h)h.textContent='Or type one below';
    const raw=(($('#sBox')||{}).value||'').trim();
    if(!raw) return;
    if(S.settings.aiKey){ await aiExtractQuestions(raw); }
    else { S.report.superQs.push({id:uid(),text:raw,done:false}); const bx=$('#sBox'); if(bx)bx.value=''; save(); render();
      toast('Added as spoken — add an API key in Setup for AI-cleaned questions'); }
  };
  sRecog.onerror=ev=>{ toast('Mic: '+ev.error); };
  try{ sRecog.start(); }catch(e){}
}
const AI_SYS_Q = `You extract the questions an architect wants to ask the site superintendent from spoken field notes recorded while walking a construction site. Output ONLY the question(s), one per line, no numbering, no preamble. Make each question concise, specific and site-appropriate, keeping the location/trade details the speaker gave. Resolve self-corrections (keep only the final intent). Ignore filler and asides. If the notes contain several distinct questions, output each on its own line.`;
async function aiExtractQuestions(raw){
  const h=$('#sHint'); if(h)h.textContent='✨ Writing question…';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':S.settings.aiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,system:AI_SYS_Q,
        messages:[{role:'user',content:raw}]})});
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error((e.error&&e.error.message)||resp.status); }
    const data=await resp.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    const lines=text.split(/\r?\n/).map(s=>s.replace(/^[\d\-.)\s]+/,'').trim()).filter(Boolean);
    if(!lines.length) throw new Error('empty');
    lines.forEach(t=>S.report.superQs.push({id:uid(),text:t,done:false}));
    const bx=$('#sBox'); if(bx)bx.value='';
    save(); render(); toast('✨ '+lines.length+' question'+(lines.length>1?'s':'')+' added');
  }catch(e){
    S.report.superQs.push({id:uid(),text:raw,done:false});
    const bx=$('#sBox'); if(bx)bx.value='';
    save(); render(); toast('AI failed ('+e.message+') — added as spoken');
  }
}

  const {prog,obs,prev}=numbered();
  const RPR='<w:rPr><w:rFonts w:ascii="Arial Narrow" w:hAnsi="Arial Narrow"/><w:color w:val="000000" w:themeColor="text1"/><w:lang w:val="en-US"/></w:rPr>';
  const itemP=(num,text)=>'<w:p><w:pPr><w:pStyle w:val="BodyText"/>'+RPR+'</w:pPr>'
    +`<w:r>${RPR}<w:t xml:space="preserve">${xesc(num)}</w:t></w:r>`
    +`<w:r>${RPR}<w:tab/><w:t xml:space="preserve">${xesc(text)}</w:t></w:r></w:p>`;
  const spacer='<w:p><w:pPr><w:pStyle w:val="BodyText"/></w:pPr></w:p>';
  const HR='<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:b/><w:bCs/><w:color w:val="000000" w:themeColor="text1"/></w:rPr>';
  const headP=t=>'<w:p><w:pPr><w:pStyle w:val="BodyText"/>'+HR+'</w:pPr>'+`<w:r>${HR}<w:t>${xesc(t)}</w:t></w:r></w:p>`;
  const DRPR='<w:rPr><w:rFonts w:ascii="Arial Narrow" w:hAnsi="Arial Narrow" w:cs="Arial"/><w:color w:val="000000" w:themeColor="text1"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr>';
  const DPPR='<w:pPr><w:tabs><w:tab w:val="left" w:pos="993"/><w:tab w:val="right" w:leader="dot" w:pos="9720"/></w:tabs><w:spacing w:after="60"/>'+DRPR+'</w:pPr>';
  const LBL='<w:rPr><w:rFonts w:ascii="Arial Narrow" w:hAnsi="Arial Narrow" w:cs="Arial"/><w:color w:val="000000" w:themeColor="text1"/></w:rPr>';
  const HYP='<w:rPr><w:rStyle w:val="Hyperlink"/><w:rFonts w:ascii="Arial Narrow" w:hAnsi="Arial Narrow" w:cs="Arial"/><w:color w:val="000000" w:themeColor="text1"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr>';
  const distP=(name,email,first)=>'<w:p>'+DPPR
    +(first?`<w:r>${LBL}<w:t xml:space="preserve">Distribution:</w:t></w:r>`:'')
    +`<w:r>${DRPR}<w:tab/><w:t xml:space="preserve">${xesc(name)} </w:t></w:r>`
    +`<w:r>${DRPR}<w:tab/><w:t xml:space="preserve"> </w:t></w:r>`
    +`<w:r>${HYP}<w:t>${xesc(email)}</w:t></w:r></w:p>`;

  let body=headP('PROGRESS OF THE WORK:');
  prog.forEach(x=>body+=itemP(x.num,x.text)+spacer);
  body+=headP('OBSERVATIONS AND COMMENTS');
  obs.forEach(x=>body+=itemP(x.num,x.text)+spacer);
  body+=headP('PREVIOUS AND UNRESOLVED DEFICIENCIES');
  prev.forEach(x=>body+=itemP(x.num,x.text)+spacer);

  const distXml = S.settings.dist.map((d,i)=>distP(d.name,d.email,i===0)).join('');
  const vals={RPT_NO:String(S.report.number), DATES:xesc(fmtDates()), TIMES:xesc(S.report.times),
    PRESENT:xesc(S.settings.present), CONTRACTOR:xesc(S.settings.contractor), PERMIT:xesc(S.settings.permit),
    PROJ_NO:xesc(S.settings.projNo), LOCATION:xesc(S.settings.location), PROJECT:xesc(S.settings.project),
    DIST_PARAS:distXml, BODY_PARAS:body};

  const zip = await JSZip.loadAsync(b64ToU8(TEMPLATE_B64));
  for(const f of ['word/document.xml','word/header1.xml']){
    let x = await zip.file(f).async('string');
    for(const k in vals) x = x.split('{{'+k+'}}').join(vals[k]);
    zip.file(f, x);
  }
  if(S.settings.sigCustom){
    zip.file('word/media/image2.png', b64ToU8(S.settings.sigCustom));
  }
  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ---- PDF ---- */
async function buildPdf(){
  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const {prog,obs,prev}=numbered();
  const doc = await PDFDocument.create();
  const helv = await doc.embedFont(StandardFonts.Helvetica);
  const helvB = await doc.embedFont(StandardFonts.HelveticaBold);
  const logo = await doc.embedPng(b64ToU8(LOGO_B64));
  const sig  = await doc.embedPng(b64ToU8(S.settings.sigCustom||SIG_B64));
  const W=612,H=792, ML=79, MR=565, TITLE_R=553;
  const black=rgb(0,0,0);
  let pages=[], pg, y;

  const wrap=(text,font,size,width)=>{
    const words=String(text).split(/\s+/); const lines=[]; let cur='';
    for(const w of words){
      const t=cur?cur+' '+w:w;
      if(font.widthOfTextAtSize(t,size)>width && cur){ lines.push(cur); cur=w; }
      else cur=t;
    }
    if(cur)lines.push(cur); return lines;
  };
  const newPage=(first)=>{
    pg = doc.addPage([W,H]); pages.push(pg);
    if(first){
      const lw=110, lh=lw*logo.height/logo.width;
      pg.drawImage(logo,{x:ML,y:H-46-lh+8,width:lw,height:lh});
      pg.drawText('GENERAL REVIEW REPORT',{x:TITLE_R-helv.widthOfTextAtSize('GENERAL REVIEW REPORT',19),y:H-72,size:19,font:helv});
      pg.drawLine({start:{x:ML,y:H-80},end:{x:TITLE_R,y:H-80},thickness:2,color:black});
      y=H-100;
    } else {
      pg.drawText('GENERAL REVIEW REPORT  No. '+S.report.number,{x:TITLE_R-helv.widthOfTextAtSize('GENERAL REVIEW REPORT  No. '+S.report.number,13),y:H-56,size:13,font:helv});
      pg.drawLine({start:{x:ML,y:H-64},end:{x:TITLE_R,y:H-64},thickness:1.2,color:black});
      y=H-86;
    }
  };
  const need=(h)=>{ if(y-h<70) newPage(false); };
  const field=(label,value,opts={})=>{
    const vs=opts.size||10.5;
    pg.drawText(label,{x:ML,y,size:8.7,font:helv});
    pg.drawText(String(value),{x:opts.vx||165,y,size:vs,font:helvB});
    if(opts.label2){
      pg.drawText(opts.label2,{x:385,y,size:8.7,font:helv});
      const v2=String(opts.value2), v2s=opts.v2size||10.5;
      pg.drawText(v2,{x:MR-helvB.widthOfTextAtSize(v2,v2s),y,size:v2s,font:helvB});
    }
    y-=opts.gap||15;
  };

  newPage(true);
  pg.drawText('Name of Project:',{x:ML,y,size:8.7,font:helv});
  pg.drawText(S.settings.project,{x:165,y:y-1,size:13.5,font:helvB});
  y-=27;
  field('Location of Project:', S.settings.location, {label2:'Report Number:', value2:S.report.number, v2size:15, gap:15});
  field('', '', {label2:'Consultant Project No.:', value2:S.settings.projNo, gap:16});
  field('Building Permit No.:', S.settings.permit);
  field('Contractor:', S.settings.contractor);
  field('Present:', S.settings.present);
  field('Date of Visit(s):', fmtDates());
  field('Time of Visit(s):', S.report.times);
  y-=18;
  const DISC="A Site Review was made by the Consultant at the date and time indicated above.  This Field Review Report is for the sole purpose of ascertaining general conformance with the design concept and does not relieve the Contractor from responsibilities for compliance with code, by-law or design requirements as described in the contract documents or as required by the authorities having jurisdiction.  This Field Review was carried out in accordance with the performance standards of the Ontario Association of Architects.  Any noted deficiencies are based on the work that was observed during this review.  The Contractor remains fully responsible for correction of all deficiencies, whether noted in this report or not.  The following construction progress and deficiencies were noted:";
  for(const ln of wrap(DISC,helv,8.8,MR-ML)){ pg.drawText(ln,{x:ML,y,size:8.8,font:helv,lineHeight:11.5}); y-=11.5; }
  y-=14;
  const sw=115, sh=sw*sig.height/sig.width;
  pg.drawImage(sig,{x:ML,y:y-sh+14,width:sw,height:sh});
  y=y-sh+8;
  pg.drawLine({start:{x:ML,y},end:{x:295,y},thickness:.8,color:black});
  y-=11; pg.drawText(S.settings.firm,{x:ML,y,size:8.8,font:helv});
  y-=11; pg.drawText(S.settings.firmEmail,{x:ML,y,size:8.8,font:helv});
  y-=22;
  S.settings.dist.forEach((d,i)=>{
    need(12);
    if(i===0) pg.drawText('Distribution:',{x:ML,y,size:8.7,font:helv});
    const nx=129;
    pg.drawText(d.name,{x:nx,y,size:9.6,font:helv});
    const ew=helv.widthOfTextAtSize(d.email,9.6);
    pg.drawText(d.email,{x:MR-ew,y,size:9.6,font:helv});
    pg.drawLine({start:{x:MR-ew,y:y-1.2},end:{x:MR,y:y-1.2},thickness:.5,color:black});
    const dotsStart=nx+helv.widthOfTextAtSize(d.name,9.6)+4, dotsEnd=MR-ew-4;
    if(dotsEnd>dotsStart){
      let dots=''; while(helv.widthOfTextAtSize(dots+'.',8)<dotsEnd-dotsStart) dots+='.';
      pg.drawText(dots,{x:dotsStart,y,size:8,font:helv});
    }
    y-=13.5;
  });
  y-=6; need(20);
  pg.drawLine({start:{x:ML,y},end:{x:TITLE_R,y},thickness:2,color:black});
  y-=20;

  const section=(title,items)=>{
    need(30);
    pg.drawText(title,{x:ML,y,size:11.5,font:helvB}); y-=16;
    for(const it of items){
      const lines=wrap(it.text,helv,10,MR-ML-37);
      need(lines.length*13+10);
      pg.drawText(it.num,{x:ML,y,size:10,font:helv});
      lines.forEach((ln,j)=>{ pg.drawText(ln,{x:ML+37,y,size:10,font:helv}); y-=13; });
      y-=6;
    }
    y-=8;
  };
  section('PROGRESS OF THE WORK:', prog);
  section('OBSERVATIONS AND COMMENTS', obs);
  section('PREVIOUS AND UNRESOLVED DEFICIENCIES', prev);

  /* photo array pages */
  const itemNum={};
  [...prog,...obs].forEach(x=>{ (x.photoIds||[]).forEach(pid=>itemNum[pid]=x.num); });
  const orderedIds=[...[...prog,...obs].flatMap(x=>x.photoIds||[]), ...S.report.generalPhotoIds];
  const cols=Math.max(1,S.settings.cols|0), rows=Math.max(1,S.settings.rows|0);
  const per=cols*rows;
  const PM=28, GAP=8, CAPH=12, TOP=56, BOT=44;
  const cw=(W-2*PM-(cols-1)*GAP)/cols;
  const ch=(H-TOP-BOT-(rows-1)*GAP-rows*CAPH)/rows;
  for(let p=0;p<orderedIds.length;p+=per){
    const ppg=doc.addPage([W,H]); pages.push(ppg);
    ppg.drawText('GENERAL REVIEW REPORT  No. '+S.report.number+'  -  PHOTOS',{x:PM,y:H-34,size:10,font:helvB});
    ppg.drawLine({start:{x:PM,y:H-42},end:{x:W-PM,y:H-42},thickness:1,color:black});
    const slice=orderedIds.slice(p,p+per);
    for(let i=0;i<slice.length;i++){
      const rec=await photoGet(slice[i]); if(!rec)continue;
      const blob=await rotatedBlob(rec, 900, cw/ch);
      const bytes=new Uint8Array(await blob.arrayBuffer());
      const img=await doc.embedJpg(bytes);
      const col=i%cols, row=(i/cols)|0;
      const cx=PM+col*(cw+GAP);
      const cellTop=H-TOP-row*(ch+CAPH+GAP);
      const cy=cellTop-ch;
      ppg.drawImage(img,{x:cx, y:cy, width:cw, height:ch});
      ppg.drawRectangle({x:cx,y:cy,width:cw,height:ch,borderColor:rgb(.55,.55,.55),borderWidth:.5,opacity:0,borderOpacity:1});
      const cap=itemNum[slice[i]];
      if(cap) ppg.drawText('Item '+cap,{x:cx+1,y:cy-9.5,size:7.5,font:helvB});
    }
  }
  /* footers */
  const total=pages.length;
  pages.forEach((p,i)=>{
    p.drawText(`${S.settings.projNo}_grr_${S.report.number}`,{x:ML-40,y:36,size:7,font:helv});
    const pn=`Page ${i+1} of ${total}`;
    p.drawText(pn,{x:MR-helv.widthOfTextAtSize(pn,8.5),y:36,size:8.5,font:helv});
    p.drawLine({start:{x:ML-40,y:30},end:{x:MR,y:30},thickness:.7,color:black});
    p.drawText(S.settings.firmAddress,{x:ML-40,y:19,size:8,font:helv});
    p.drawText(S.settings.firmTel,{x:MR-helv.widthOfTextAtSize(S.settings.firmTel,8),y:19,size:8,font:helv});
  });
  const bytes=await doc.save();
  return new Blob([bytes],{type:'application/pdf'});
}

/* ---- import a previous report (.docx) ---- */
let IMP=null;
async function importReport(file){
  try{
    if(!/\.docx$/i.test(file.name)) throw new Error('Please use the .docx version of the report (not the PDF)');
    const zip=await JSZip.loadAsync(file);
    const f=zip.file('word/document.xml'); if(!f) throw new Error('Not a Word document');
    const xml=await f.async('string');
    const paras=xml.split('</w:p>').map(p=>{
      const p2=p.replace(/<w:tab[^>]*\/>/g,'<w:t>\t</w:t>');
      const t=(p2.match(/<w:t[^>]*>[\s\S]*?<\/w:t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('');
      return t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
    }).filter(Boolean);
    const all=paras.join('\n');
    const num=(all.match(/Report Number:\s*(\d+)/)||[])[1];
    if(!num) throw new Error('Could not find "Report Number:" in the document');
    const g=(re)=>{ const m=all.match(re); return m?m[1].trim():null; };
    const hdr={
      project:g(/Name of Project:\s*\t?([^\n\t]+)/),
      location:g(/Location of Project:\s*\t?([^\n\t]+)/),
      projNo:g(/Consultant Project No\.:\s*\t?([^\n\t]+)/),
      permit:g(/Building Permit No\.:\s*\t?([^\n\t]+)/),
      contractor:g(/Contractor:\s*\t?([^\n\t]+)/),
      present:g(/Present:\s*\t?([^\n\t]+)/)
    };
    let sec=null; const prog=[],obs=[],prev=[];
    for(const p of paras){
      if(/PROGRESS OF THE WORK/i.test(p)){sec='p';continue;}
      if(/OBSERVATIONS AND COMMENTS/i.test(p)){sec='o';continue;}
      if(/PREVIOUS AND UNRESOLVED/i.test(p)){sec='v';continue;}
      const m=p.match(/^(\d+\.\d+)[\s\t]+([\s\S]+)/);
      if(sec&&m){
        const it={num:m[1],text:m[2].replace(/\s+/g,' ').trim()};
        (sec==='p'?prog:sec==='o'?obs:prev).push(it);
      }
    }
    if(!prog.length&&!obs.length&&!prev.length) throw new Error('No numbered report items found');
    IMP={number:parseInt(num),hdr,prog,obs,prev,name:file.name};
    render();
    toast('Read GRR No. '+num+' — choose what to do with it');
  }catch(e){ toast('Import failed: '+e.message); }
}
function importApplyHdr(){
  const h=IMP.hdr;
  for(const k of ['project','location','projNo','permit','contractor','present'])
    if(h[k]) S.settings[k]=h[k];
}
async function importClearPhotos(){
  for(const id of S.report.generalPhotoIds||[]) await photoDel(id);
  for(const o of [...(S.report.progress||[]),...(S.report.obs||[])])
    for(const pid of o.photoIds||[]) await photoDel(pid);
}
async function importCreateNext(){
  if(!IMP) return;
  if(!confirm('Create Report No. '+(IMP.number+1)+' from '+IMP.name+'?\n\nObservations & unresolved deficiencies carry forward; the current in-app report and its photos are replaced. Walk-mode recordings and super questions are kept.')) return;
  const carried=IMP.prev.map(x=>({num:x.num,text:x.text,resolved:false}))
    .concat(IMP.obs.map(x=>({num:x.num,text:x.text,resolved:false})));
  await importClearPhotos();
  const keepWalk=S.report.walkNotes||[], keepQs=S.report.superQs||[];
  importApplyHdr();
  S.report=freshReport(IMP.number+1, carried);
  S.report.walkNotes=keepWalk; S.report.superQs=keepQs;
  const n=S.report.number; IMP=null; save(); TAB='report'; render();
  toast('Report No. '+n+' set up — what date(s) do the visits apply to? Enter them here.');
}
async function importLoadCurrent(){
  if(!IMP) return;
  if(!confirm('Load '+IMP.name+' as the current report? The current in-app report and its photos are replaced.')) return;
  await importClearPhotos();
  importApplyHdr();
  const boilRe=/For Mechanical, Electrical/i;
  const keepWalk=S.report.walkNotes||[], keepQs=S.report.superQs||[];
  S.report={number:IMP.number,dates:[],times:'10:00 a.m.',
    progress:IMP.prog.map(x=>({id:uid(),text:x.text,photoIds:[],boiler:boilRe.test(x.text)})),
    obs:IMP.obs.map(x=>({id:uid(),text:x.text,photoIds:[]})),
    prev:IMP.prev.map(x=>({num:x.num,text:x.text,resolved:false})),
    generalPhotoIds:[],walkNotes:keepWalk,superQs:keepQs};
  const n=S.report.number; IMP=null; save(); TAB='report'; render();
  toast('Report No. '+n+' loaded — set its visit dates');
}

/* ---- wake lock ---- */
let wl=null;
async function keepAwake(){ try{ wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
keepAwake();

/* ---- SW ---- */
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

render();
</script>
